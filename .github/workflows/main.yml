# ============================================================
# Similarity Scorer — All-in-one GitHub Actions host
# - بار اول: دانلود پکیج‌ها + مدل‌ها و آپلود به GitHub Release
# - بارهای بعد: استفاده از cache و Release (بدون دانلود مجدد)
# - فرمول کالیبره‌شده: 0.4*sim + 0.6*entail - 0.7*contra
# ============================================================

name: Host Similarity Scorer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v1-fastapi-uvicorn-sentence-transformers-transformers-torch-pydantic

      - name: Cache HF models (fast path)
        id: cache_hf
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-v1-e5small-mdeberta

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet fastapi "uvicorn[standard]" sentence-transformers transformers torch pydantic

      - name: Create app.py
        run: |
          cat > app.py << 'PYEOF'
          import torch
          from contextlib import asynccontextmanager
          from fastapi import FastAPI
          from fastapi.responses import HTMLResponse
          from pydantic import BaseModel
          from sentence_transformers import SentenceTransformer, util
          from transformers import AutoTokenizer, AutoModelForSequenceClassification

          embedder = None
          nli_tok = None
          nli_model = None
          NLI_LABELS = {}

          def load_models():
              global embedder, nli_tok, nli_model, NLI_LABELS
              if embedder is not None and nli_model is not None:
                  return
              print("Loading embedder (multilingual-e5-small)...", flush=True)
              embedder = SentenceTransformer("intfloat/multilingual-e5-small")
              print("Loading NLI (mDeBERTa-v3-base-mnli-xnli)...", flush=True)
              nli_name = "MoritzLaurer/mDeBERTa-v3-base-mnli-xnli"
              nli_tok = AutoTokenizer.from_pretrained(nli_name)
              nli_model = AutoModelForSequenceClassification.from_pretrained(nli_name)
              nli_model.eval()
              NLI_LABELS = {i: l.lower() for i, l in nli_model.config.id2label.items()}
              print("Models ready.", flush=True)

          @asynccontextmanager
          async def lifespan(app):
              load_models()
              yield

          app = FastAPI(title="Similarity Scorer", lifespan=lifespan)

          HTML_PAGE = """<!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>نمره‌دهی تشریحی</title>
          <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
          .card{background:#fff;border-radius:20px;padding:40px;max-width:820px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
          h1{color:#333;margin-bottom:8px;font-size:26px}
          .subtitle{color:#666;margin-bottom:28px;font-size:14px}
          label{display:block;margin-bottom:8px;color:#444;font-weight:600;font-size:14px}
          textarea{width:100%;min-height:100px;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-family:inherit;font-size:15px;resize:vertical;transition:border-color .3s}
          textarea:focus{outline:none;border-color:#667eea}
          .field{margin-bottom:20px}
          button{width:100%;padding:15px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
          button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.4)}
          button:disabled{opacity:.6;cursor:wait}
          .result{margin-top:28px;padding:24px;background:#f8f9ff;border-radius:15px;border:2px solid #e0e7ff;display:none}
          .result.show{display:block;animation:fadeIn .3s}
          @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
          .score-big{font-size:52px;font-weight:800;text-align:center;margin:10px 0}
          .score-bar{height:12px;background:#e0e0e0;border-radius:6px;overflow:hidden;margin:15px 0}
          .score-fill{height:100%;transition:width .6s;border-radius:6px}
          .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
          .metric{background:#fff;padding:12px;border-radius:10px;text-align:center}
          .metric-label{font-size:12px;color:#666;margin-bottom:5px}
          .metric-value{font-size:20px;font-weight:700;color:#333}
          .error{color:#e53e3e;background:#fff5f5;padding:15px;border-radius:10px;margin-top:15px;font-size:14px}
          .footer{text-align:center;margin-top:20px;color:#999;font-size:12px}
          </style>
          </head>
          <body>
          <div class="card">
          <h1>نمره‌دهی جواب تشریحی</h1>
          <div class="subtitle">مقایسه معنایی جواب کاربر با جواب مرجع</div>
          <div class="field">
          <label>جواب مرجع (کلید)</label>
          <textarea id="ref" placeholder="جواب صحیح را وارد کنید..."></textarea>
          </div>
          <div class="field">
          <label>جواب کاربر</label>
          <textarea id="usr" placeholder="جواب کاربر را وارد کنید..."></textarea>
          </div>
          <button id="btn" onclick="score()">محاسبه نمره</button>
          <div id="result" class="result"></div>
          <div class="footer">multilingual-e5-small + mDeBERTa-v3-mnli</div>
          </div>
          <script>
          async function score(){
            const btn=document.getElementById('btn');
            const result=document.getElementById('result');
            const ref=document.getElementById('ref').value.trim();
            const usr=document.getElementById('usr').value.trim();
            if(!ref||!usr){alert('هر دو متن را وارد کنید');return;}
            btn.disabled=true;btn.textContent='در حال محاسبه...';
            result.classList.remove('show');
            try{
              const res=await fetch('/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref,user_answer:usr})});
              if(!res.ok)throw new Error('HTTP '+res.status);
              const data=await res.json();
              displayResult(data);
            }catch(e){
              result.innerHTML='<div class="error">خطا: '+e.message+'</div>';
              result.classList.add('show');
            }finally{
              btn.disabled=false;btn.textContent='محاسبه نمره';
            }
          }
          function displayResult(d){
            const result=document.getElementById('result');
            const pct=Math.round(d.score*100);
            let color='#e53e3e';
            if(pct>=75)color='#38a169';
            else if(pct>=50)color='#ed8936';
            else if(pct>=25)color='#ecc94b';
            let html='<div class="score-big" style="color:'+color+'">'+pct+'%</div>';
            html+='<div class="score-bar"><div class="score-fill" style="width:'+pct+'%;background:'+color+'"></div></div>';
            html+='<div class="metrics">';
            html+='<div class="metric"><div class="metric-label">شباهت</div><div class="metric-value">'+Math.round(d.sim*100)+'%</div></div>';
            if(d.entailment!==null){
              html+='<div class="metric"><div class="metric-label">تطابق</div><div class="metric-value">'+Math.round(d.entailment*100)+'%</div></div>';
              html+='<div class="metric"><div class="metric-label">تناقض</div><div class="metric-value">'+Math.round(d.contradiction*100)+'%</div></div>';
            }
            html+='</div>';
            if(d.reason==='too_different')html+='<div class="error">جواب بسیار متفاوت از مرجع است</div>';
            result.innerHTML=html;
            result.classList.add('show');
          }
          </script>
          </body>
          </html>"""

          class ScoreReq(BaseModel):
              reference: str
              user_answer: str

          @app.get("/", response_class=HTMLResponse)
          def index():
              return HTML_PAGE

          @app.get("/health")
          def health():
              ready = embedder is not None and nli_model is not None
              return {"status": "ok", "ready": ready}

          @app.post("/score")
          def score(req: ScoreReq):
              if embedder is None or nli_model is None:
                  return {"score": 0.0, "sim": 0.0, "entailment": None,
                          "contradiction": None, "reason": "models_not_ready"}

              # مرحله 1: شباهت برداری
              ref_emb, usr_emb = embedder.encode(
                  [f"query: {req.reference}", f"passage: {req.user_answer}"],
                  normalize_embeddings=True,
              )
              sim = float(util.cos_sim(ref_emb, usr_emb).item())
              result = {"sim": round(sim, 3), "entailment": None,
                        "contradiction": None, "score": 0.0, "reason": "ok"}

              if sim < 0.4:
                  result["reason"] = "too_different"
                  return result

              # مرحله 2: NLI
              inp = nli_tok(req.reference, req.user_answer,
                            truncation=True, max_length=512, return_tensors="pt")
              with torch.no_grad():
                  probs = torch.softmax(nli_model(**inp).logits, dim=-1)[0].tolist()

              entail = 0.0
              contra = 0.0
              for i, name in NLI_LABELS.items():
                  if "entail" in name:
                      entail = probs[i]
                  elif "contra" in name:
                      contra = probs[i]

              # مرحله 3: نمره نهایی — میانگین وزن‌دار کالیبره‌شده
              # برای متن یکسان: 0.4*1.0 + 0.6*0.99 - 0.7*0.0 ≈ 1.0 ✅
              # برای جواب ناقص: 0.4*0.89 + 0.6*0.92 - 0.7*0.0 ≈ 0.91
              # برای تناقض: 0.4*0.85 + 0.6*0.1 - 0.7*0.8 ≈ 0.0 (جریمه شدید)
              final = 0.4 * sim + 0.6 * entail - 0.7 * contra
              final = max(0.0, min(1.0, final))

              result.update({
                  "entailment": round(entail, 3),
                  "contradiction": round(contra, 3),
                  "score": round(final, 3),
              })
              return result
          PYEOF
          python -c "compile(open('app.py').read(), 'app.py', 'exec')" && echo "app.py syntax OK ($(wc -l < app.py) lines)"

      - name: Ensure models available (release fallback)
        if: steps.cache_hf.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          RESTORED=false
          mkdir -p ~/.cache/huggingface

          echo "HF cache miss. Trying GitHub Release..."
          if gh release download model-cache --repo "${{ github.repository }}" \
               --pattern 'hf-cache.tar.gz' \
               --output /tmp/hf-cache.tar.gz --clobber 2>/dev/null; then
            echo "Extracting models from release..."
            tar -xzf /tmp/hf-cache.tar.gz -C ~/.cache/
            rm -f /tmp/hf-cache.tar.gz
            RESTORED=true
            echo "Models restored from release."
          fi

          if [ "$RESTORED" = "false" ]; then
            echo "No release found. Downloading models from HuggingFace..."
            python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('intfloat/multilingual-e5-small'); print('embedder cached')"
            python -c "from transformers import AutoTokenizer, AutoModelForSequenceClassification; n='MoritzLaurer/mDeBERTa-v3-base-mnli-xnli'; AutoTokenizer.from_pretrained(n); AutoModelForSequenceClassification.from_pretrained(n); print('NLI cached')"

            echo "Packaging models for future runs..."
            tar -czf /tmp/hf-cache.tar.gz -C ~/.cache huggingface
            ls -lh /tmp/hf-cache.tar.gz

            if gh release view model-cache --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Updating existing release..."
              gh release upload model-cache --repo "${{ github.repository }}" \
                /tmp/hf-cache.tar.gz --clobber
            else
              echo "Creating new release..."
              gh release create model-cache --repo "${{ github.repository }}" \
                --title "Model Cache" \
                --notes "Cached HuggingFace models for Similarity Scorer. Delete this release to force re-download on next run." \
                /tmp/hf-cache.tar.gz
            fi
            echo "Models uploaded to release. Future runs will reuse this."
          fi

      - name: Download cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start server + tunnel
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -e

          python -m uvicorn app:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          echo "Waiting for server to load models..."
          READY=0
          for i in $(seq 1 90); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::Server process died during startup"
              cat server.log
              exit 1
            fi
            if curl -s http://localhost:8000/health | grep -q '"ready":true'; then
              echo "Server ready after $((i*10))s"
              READY=1
              break
            fi
            sleep 10
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Server failed to become ready"
            cat server.log
            exit 1
          fi

          ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > cf.log 2>&1 &
          TUNNEL_PID=$!

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log 2>/dev/null | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "::error::Failed to get tunnel URL"
            cat cf.log
            exit 1
          fi

          echo ""
          echo "========================================================"
          echo "LIVE URL: $URL"
          echo "========================================================"
          echo ""
          {
            echo "## Live URL"
            echo ""
            echo "### $URL"
            echo ""
            echo "_Ephemeral URL — dies when this workflow ends (max ~6h). Re-run to get a new one._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Keeping workflow alive..."
          while kill -0 $SERVER_PID 2>/dev/null && kill -0 $TUNNEL_PID 2>/dev/null; do
            sleep 60
          done

          echo "Server or tunnel died. Dumping logs..."
          tail -50 server.log cf.log || true
          exit 1
